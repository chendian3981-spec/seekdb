[package]
name = "local"
version = "0.1.0"
edition = "2021"
publish = false
links = "local"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
kv = { path = "../kv" }
cxx = "1"
parquet = { version = "=59.0.0", default-features = false, features = ["snap", "flate2", "flate2-rust_backened"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"

[build-dependencies]
cxx-build = "1"
